<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スポーツ動画撮影・分析＆編集アプリ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }
        h2 { font-size: 1.1rem; margin: 5px 0; color: #4CAF50; }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .file-inputs {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
            display: flex;
            justify-content: center;
        }
        video {
            width: 100%;
            max-height: 330px;
            display: block;
            object-fit: contain;
            pointer-events: auto;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            touch-action: none;
        }
        .drawing-mode canvas {
            pointer-events: auto; /* お絵描きONの時はキャンバス操作優先 */
        }
        .controls, .tools {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            align-items: center;
        }
        button, label.file-btn {
            font-size: 0.85rem;
            padding: 8px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background: #444;
            color: #fff;
            text-align: center;
        }
        button:active { opacity: 0.7; }
        .btn-primary { background: #2196F3; }
        .btn-success { background: #4CAF50; }
        .btn-danger { background: #f44336; }
        .btn-warning { background: #ff9800; color: #000; }
        .btn-record { background: #e91e63; }
        
        .tool-active { border: 2px solid #fff; background: #666 !important; }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
        }
        input[type="file"] { display: none; }
        
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }
        @media(min-width: 768px) {
            .compare-grid { grid-template-columns: 1fr 1fr; max-width: 1000px; }
        }
    </style>
</head>
<body>

    <h2>📋 スポーツ動画解説・比較ツール</h2>

    <div class="container">
        <!-- 入力・撮影切り替えエリア -->
        <div class="file-inputs">
            <label class="file-btn btn-primary">
                📁 動画ファイル選択
                <input type="file" id="videoInput1" accept="video/*" onchange="loadVideo(event, 'video1')">
            </label>
            <label class="file-btn btn-record">
                🎥 その場ですぐ撮影
                <input type="file" id="cameraInput" accept="video/*" capture="environment" onchange="loadVideo(event, 'video1')">
            </label>
            <button class="btn-warning" onclick="toggleCompareMode()">対比モード</button>
        </div>

        <div class="compare-grid" id="compareContainer">
            <!-- メイン動画セクション -->
            <div>
                <div class="video-wrapper" id="wrapper1">
                    <video id="video1" controls playsinline webkit-playsinline muted></video>
                    <canvas id="canvas1"></canvas>
                </div>
                <div class="controls">
                    <button onclick="skipTime('video1', -0.1)">◀ 戻す</button>
                    <button onclick="skipTime('video1', 0.1)">進める ▶</button>
                    <button class="btn-success" onclick="takeSnapshot()">📷 スクショ</button>
                    <button id="recBtn" class="btn-record" onclick="toggleRecordVideo()">🔴 描画入り動画保存</button>
                </div>
            </div>

            <!-- 比較用動画セクション（初期非表示） -->
            <div id="subVideoSection" style="display: none;">
                <div class="file-inputs" style="margin-bottom: 5px; padding:4px;">
                    <label class="file-btn btn-primary" style="font-size:0.75rem; padding:4px 8px;">
                        📁 比較用ファイル
                        <input type="file" id="videoInput2" accept="video/*" onchange="loadVideo(event, 'video2')">
                    </label>
                </div>
                <div class="video-wrapper">
                    <video id="video2" controls playsinline webkit-playsinline muted></video>
                </div>
                <div class="controls">
                    <button onclick="skipTime('video2', -0.1)">◀ 戻す</button>
                    <button onclick="skipTime('video2', 0.1)">進める ▶</button>
                    <button class="btn-success" onclick="syncPlay()">🔗 同時再生</button>
                </div>
            </div>
        </div>

        <!-- お絵描きコントロール -->
        <div class="tools">
            <button id="drawModeBtn" class="btn-primary" onclick="toggleDrawMode()">✏️ お絵描き: OFF</button>
            <div class="color-dot" style="background: red;" onclick="setPenColor('red')"></div>
            <div class="color-dot" style="background: yellow;" onclick="setPenColor('yellow')"></div>
            <div class="color-dot" style="background: cyan;" onclick="setPenColor('cyan')"></div>
            <button id="eraserBtn" class="btn-warning" onclick="setEraser()">消しゴム</button>
            <button class="btn-danger" onclick="clearCanvas()">全消去</button>
        </div>
    </div>

    <canvas id="exportCanvas" style="display:none;"></canvas>

    <script>
        let isDrawMode = false;
        let video1 = document.getElementById('video1');
        let canvas1 = document.getElementById('canvas1');
        let ctx1 = canvas1.getContext('2d');

        function loadVideo(event, videoId) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                const video = document.getElementById(videoId);
                video.src = url;
                video.load();
                video.onloadedmetadata = () => {
                    if (videoId === 'video1') {
                        initCanvas();
                    }
                };
            }
        }

        function initCanvas() {
            canvas1.width = video1.videoWidth || 640;
            canvas1.height = video1.videoHeight || 360;
            ctx1.lineWidth = Math.max(canvas1.width / 150, 4);
            ctx1.lineCap = 'round';
            ctx1.lineJoin = 'round';
        }

        function skipTime(videoId, seconds) {
            const v = document.getElementById(videoId);
            v.currentTime += seconds;
        }

        function toggleCompareMode() {
            const sub = document.getElementById('subVideoSection');
            sub.style.display = (sub.style.display === 'none') ? 'block' : 'none';
        }

        function syncPlay() {
            const v2 = document.getElementById('video2');
            if (video1.paused) {
                video1.play();
                v2.play();
            } else {
                video1.pause();
                v2.pause();
            }
        }

        function toggleDrawMode() {
            isDrawMode = !isDrawMode;
            const wrapper = document.getElementById('wrapper1');
            const btn = document.getElementById('drawModeBtn');
            if (isDrawMode) {
                wrapper.classList.add('drawing-mode');
                btn.innerText = '✏️ お絵描き: ON';
                btn.style.background = '#4CAF50';
            } else {
                wrapper.classList.remove('drawing-mode');
                btn.innerText = '✏️ お絵描き: OFF';
                btn.style.background = '#2196F3';
            }
        }

        // --- 描画ロジック ---
        let drawing = false;
        let penColor = 'red';
        let isEraser = false;

        function setPenColor(color) {
            penColor = color;
            isEraser = false;
            document.getElementById('eraserBtn').classList.remove('tool-active');
        }

        function setEraser() {
            isEraser = true;
            document.getElementById('eraserBtn').classList.add('tool-active');
        }

        function clearCanvas() {
            ctx1.clearRect(0, 0, canvas1.width, canvas1.height);
        }

        function getPos(e) {
            const rect = canvas1.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas1.width / rect.width),
                y: (clientY - rect.top) * (canvas1.height / rect.height)
            };
        }

        canvas1.addEventListener('mousedown', startDraw);
        canvas1.addEventListener('mousemove', draw);
        canvas1.addEventListener('mouseup', stopDraw);
        canvas1.addEventListener('touchstart', startDraw);
        canvas1.addEventListener('touchmove', draw);
        canvas1.addEventListener('touchend', stopDraw);

        function startDraw(e) {
            if (!isDrawMode) return;
            drawing = true;
            const pos = getPos(e);
            ctx1.beginPath();
            ctx1.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!drawing || !isDrawMode) return;
            const pos = getPos(e);
            if (isEraser) {
                ctx1.clearRect(pos.x - 15, pos.y - 15, 30, 30);
            } else {
                ctx1.strokeStyle = penColor;
                ctx1.lineTo(pos.x, pos.y);
                ctx1.stroke();
            }
            e.preventDefault();
        }

        function stopDraw() {
            drawing = false;
        }

        // --- スクリーンショット保存 ---
        function takeSnapshot() {
            const expCanvas = document.getElementById('exportCanvas');
            const expCtx = expCanvas.getContext('2d');
            expCanvas.width = canvas1.width;
            expCanvas.height = canvas1.height;

            expCtx.drawImage(video1, 0, 0, expCanvas.width, expCanvas.height);
            expCtx.drawImage(canvas1, 0, 0);

            const link = document.createElement('a');
            link.download = 'sports_analysis.png';
            link.href = expCanvas.toDataURL('image/png');
            link.click();
        }

        // --- 書き込み入り動画の保存（MediaRecorder活用） ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        function toggleRecordVideo() {
            const recBtn = document.getElementById('recBtn');
            if (!isRecording) {
                // 録画開始
                recordedChunks = [];
                const stream = canvas1.captureStream(30); // 30fpsでキャンバスをストリーム化
                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream); // フォールバック
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'sports_commentary.webm';
                    a.click();
                };

                mediaRecorder.start();
                isRecording = true;
                recBtn.innerText = "⏹️ 録画停止＆保存";
                recBtn.style.background = "#333";
                
                // 動画も一緒に再生させる
                video1.play();
            } else {
                // 録画終了
                mediaRecorder.stop();
                isRecording = false;
                recBtn.innerText = "🔴 描画入り動画保存";
                recBtn.style.background = "#e91e63";
            }
        }
    </script>
</body>
</html>
